/* ---------- alerts: toasts + sounds + confetti ---------- */
const cv=document.createElement("canvas");cv.style.cssText="position:fixed;inset:0;pointer-events:none;z-index:99";document.body.appendChild(cv);
function confetti(){
  if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;
  const ctx=cv.getContext("2d");cv.width=innerWidth;cv.height=innerHeight;
  const cols=["#3ecf74","#f5c542","#a785ff","#3dd6e6","#ffffff","#ff6b6b"];
  const ps=Array.from({length:170},()=>({x:innerWidth/2+(Math.random()-.5)*240,y:innerHeight*.35,vx:(Math.random()-.5)*15,vy:-Math.random()*15-4,w:6+Math.random()*6,h:4+Math.random()*5,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[Math.random()*cols.length|0]}));
  let f=0;(function step(){ctx.clearRect(0,0,cv.width,cv.height);
    ps.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore()});
    if(++f<190)requestAnimationFrame(step);else ctx.clearRect(0,0,cv.width,cv.height)})();
}
let AC=null;
function updSnd(){const b=$("snd"),locked=S.sound&&!(AC&&AC.state==="running");b.textContent=S.sound?"🔔":"🔕";b.classList.toggle("lock",locked);b.title=locked?"Click anywhere on the page once to enable alert sounds":"Alert sounds"}
function unlock(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==="suspended")AC.resume().then(updSnd,()=>{});updSnd()}
addEventListener("click",unlock);addEventListener("keydown",unlock);
function notes(list,type,gain,len){
  if(!S.sound||!AC)return;if(AC.state==="suspended")AC.resume();const t0=AC.currentTime+.02;
  list.forEach(([f,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;
    g.gain.setValueAtTime(0,t0+d);g.gain.linearRampToValueAtTime(gain,t0+d+.02);g.gain.exponentialRampToValueAtTime(.001,t0+d+len);

function computePower(lg){

      v.forEach(([o,q])=>{if(o!==rid){if(p>q)T[rid].apw++;else if(p<q)T[rid].apl++}});
      if(!hi||p>hi[1])hi=[rid,p,w];if(!lo||p<lo[1])lo=[rid,p,w]})});

            same NFL team (QB↔WR .40, QB↔TE .35, QB↔RB .15, RB↔RB −.15, K↔offense .15–.20),
            a D/ST vs the offense it faces (QB −.40, others −.20), and offenses in the same game (+.10 shootouts).

  const sel=S.L.length>1?`<div class="mvsel">${S.L.map(l=>`<button class="mvb ${l.id===lg.id?"on":""}" data-l="${l.id}">${esc(shortName(l.league.name))}</button>`).join("")}</div>`:"";
  let h=`<div class="card fhd"><div class="fsc"><span class="fme">${esc(ta.owner||ta.name)} <b>${f2(a.total)}</b></span><span class="fwp" title="Win probability ${p}%"><i style="width:${p}%"></i></span><span class="fop"><b>${b?f2(b.total):"–"}</b> ${b?esc(tb.owner||tb.name):""}</span></div>
    <div class="fctl">${sel}<span class="flg">${["QB","RB","WR","TE","K","DEF"].map(x=>`<span><i style="background:${POSC[x]}"></i>${x}</span>`).join("")}<span><i class="rme"></i>yours</span><span><i class="rop"></i>theirs</span></span><button class="mvb ${FD.showAll?"on":""}" id="fdall" title="Include incompletions, 0-yard plays and targets">${FD.showAll?"All plays":"Key plays"}</button><span class="fbeta">beta</span></div></div>`;
  /* LIVE NOW */
  const live=[...evs].map(e=>liveStrip(e,rel[e]||{},lg)).filter(Boolean);
  const nextK=[...mine,...theirs].filter(x=>x&&x.g&&x.g.state==="pre"&&x.g.date).map(x=>new Date(x.g.date)).sort((x,y)=>x-y)[0];
  h+=live.length?`<div class="fsec"><div class="fst"><i class="ld"></i>Live now <small>${live.length} game${live.length>1?"s":""} with your matchup's starters</small></div><div class="lvgrid">${live.join("")}</div></div>`
    :`<div class="fsec quiet"><div class="fst">Live now <small>No games in progress${nextK?` · next kickoff ${nextK.toLocaleDateString([],{weekday:"short"})} ${hm(nextK)}`:""}</small></div></div>`;
  /* HEAD TO HEAD */
  const pair=(x,sd,i)=>{if(!x)return`<div class="h2c empty"></div>`;const rd=fdRead(x.p,x.tt,x.r),uid=`${sd}${i}`;
    const ty=x.tt.filter(t=>/run|rec/.test(t.role)),line=x.p.pos==="QB"?(()=>{const ps=x.tt.filter(t=>t.role==="pass"),c=ps.filter(t=>!t.inc);return`${c.length}/${ps.length} · ${c.reduce((s,t)=>s+t.yd,0)} yds`})():x.p.pos==="K"||x.p.pos==="DEF"?`${x.tt.length} plays`:`${ty.length} touches · ${ty.reduce((s,t)=>s+t.yd,0)} yds`;
    return`<div class="h2c ${sd}" style="--c:${POSC[x.p.pos]||"#ccc"}"><div class="h2h"><span class="h2a ${sd}"><img src="${avatarUrl(x.p)}" alt="" onerror="this.style.visibility='hidden'"></span><div class="h2n"><b>${esc(x.p.name)}</b><small><span class="pos ${esc(x.p.pos)}">${esc(x.p.pos)}</span> ${esc(gtextPlain(x.p))}</small></div><em>${f2(x.r.a)}</em></div>${miniMap(x.p,x.tt,sd,uid)}<div class="h2f"><span class="h2rd">${rd[0]} ${esc(rd[1])}</span><span class="pm">${line}</span></div></div>`};
  const rowsH=slots.map((sl,i)=>{const x=mine[i],y=theirs[i];if(!x&&!y)return"";const d=(x?x.r.a:0)-(y?y.r.a:0);
    return`<div class="h2r"><div class="h2l">${pair(x,"me",i)}</div><div class="h2m"><span class="h2s">${sl}</span><span class="h2d ${d>0?"me":d<0?"op":""}">${d===0?"=":(d>0?"◀ ":"")+"+"+f2(Math.abs(d))+(d<0?" ▶":"")}</span></div><div class="h2l">${pair(y,"op",i)}</div></div>`}).join("");
  h+=`<div class="fsec"><div class="fst">Head to head <small>every touch this week · dot size = fantasy points · gold ring = TD · always driving right →</small></div><div class="h2hd"><span class="me">${esc(ta.owner||ta.name)}</span><span></span><span class="op">${b?esc(tb.owner||tb.name):""}</span></div>${rowsH}</div>`;
  /* WHO SCORED WHEN (from the plays) */
  const byQ=arr=>{const q=[0,0,0,0,0];arr.forEach(x=>x&&x.tt.forEach(t=>{const k=Math.min(4,Math.max(0,(t.per||1)-1));q[k]+=t.pts||0}));return q};
  const qa=byQ(mine),qb=byQ(theirs),mx=Math.max(1,...qa,...qb),ql=["Q1","Q2","Q3","Q4","OT"];
  h+=`<div class="fsec"><div class="fst">Who scored when <small>points from plays, by quarter (all games combined; bonuses not included)</small></div><div class="card qsw">${ql.map((q,i)=>i===4&&!qa[4]&&!qb[4]?"":`<div class="qc"><span class="qn">${q}</span><div class="qb"><i class="me" style="width:${qa[i]/mx*100}%"></i><em>${f2(qa[i])}</em></div><div class="qb"><i class="op" style="width:${qb[i]/mx*100}%"></i><em>${f2(qb[i])}</em></div></div>`).join("")}</div></div>`;
  Object.keys(S.drv).forEach(e=>{FD.loaded[e]=true});
  if(h===FD.lastHtml)return;FD.lastHtml=h;el.innerHTML=h;
  el.querySelectorAll(".mvsel .mvb").forEach(bt=>bt.onclick=()=>{FD.lg=bt.dataset.l;fdRender();fdTick()});
  const fa=el.querySelector("#fdall");if(fa)fa.onclick=()=>{FD.showAll=!FD.showAll;fdRender()};
}

/* ---------- tabs ---------- */
S.tab=load("tab")||"m";
function setTab(t){
  S.tab=t;save("tab",t);document.body.classList.toggle("tab-s",t==="s");document.body.classList.toggle("tab-x",t!=="m");
  document.querySelectorAll("header .tb").forEach(b=>b.classList.toggle("on",b.dataset.t===t));
  const loggedIn=S.L.length>0,onWelcome=$("welcome").style.display!=="none";
  $("surv").style.display=t==="s"?"":"none";$("pick").style.display=t==="p"?"":"none";$("moves").style.display=t==="t"?"":"none";$("field").style.display=t==="f"?"":"none";
  if(t!=="m"){$("view").style.display="none";$("welcome").style.display="none";$("status").style.display="none"}
  if(t==="s"){SV.lastHtml="";svRender();svTick()}
  else if(t==="p"){PK.lastHtml="";pkRender();pkTick()}
  else if(t==="t"){MV.lastHtml="";mvRender();mvTick()}
  else if(t==="f"){FD.lastHtml="";fdRender();fdTick()}
  else{if(loggedIn){$("view").style.display="";$("welcome").style.display="none";applyVis()}else{$("welcome").style.display=""}}
}
document.querySelectorAll("header .tb").forEach(b=>b.onclick=()=>setTab(b.dataset.t));
SV.lastTick=0;setInterval(async()=>{const n=Date.now(),every=(+$("every").value||3)*1000;if(n-SV.lastTick>=(S.tab==="s"||S.tab==="p"?every:15000)){SV.lastTick=n;await svTick();if(S.tab==="p")await pkTick();else if(PK.weeks)await pkLoadNext(PK.weeks,15000);try{renderSweat()}catch(e){}}},1000);
setInterval(()=>{if(S.tab==="t")mvTick()},30000);
pkLoad();
svInit().then(()=>{if(S.tab!=="m")setTab(S.tab)});
$("go").onclick=connectAll;
$("wshare").onclick=async()=>{const ok=await copyText(setupLink());const b=$("wshare");b.textContent=ok?"✓ Link copied":"Couldn't copy";setTimeout(()=>{b.textContent="⧉ Copy setup link"},2200)};

$("week").onchange=()=>{S.L.forEach(l=>{l.rf={}});S.raw=null;S.baseWeek=0;S.stats={};S.statsHave=false;S.statsVol=0;S.desc={};S.stxt="";S.eff={};S.box={};S.fl={};S.fltxt={};S.reg={};S.effPrimed=false;S.okFast=false;S.dirty=true;S.L.forEach(l=>Object.assign(l,{mu:null,prev:{},delta:{},acc:{},off:{},offi:{},cmp:{},log:[],hist:{},focus:null,leadSign:0,lastHtml:"",primed:false}));refresh()};
$("every").onchange=schedule;
document.addEventListener("visibilitychange",()=>{if(!document.hidden)refresh()});
addEventListener("online",()=>refresh());addEventListener("offline",()=>document.body.classList.add("offline"));
if(window.matchMedia)matchMedia("(max-width:760px)").addEventListener("change",()=>{if(S.L.length)applyVis()});
setInterval(tickStatus,1000);
$("who").onclick=()=>{showWelcome();$("werr").textContent=""};
$("wback").onclick=()=>{$("welcome").style.display="none";$("view").style.display=""};
let urlUser="";try{urlUser=new URLSearchParams(location.search).get("user")||""}catch(e){}
if(urlUser&&!getConns().some(c=>c.p==="sleeper"&&c.username.toLowerCase()===urlUser.toLowerCase())){const c=getConns().concat({key:"sleeper:"+urlUser.toLowerCase(),p:"sleeper",username:urlUser});save("conns",JSON.stringify(c))}
if(getConns().length){$("welcome").style.display="none";connectAll()}else{showWelcome()}
</script>
</body>
