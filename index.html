<style>
:root{color-scheme:dark;--bg:#000;--s1:#0d0d11;--s2:#15151b;--ink:#f2f2f6;--mute:#8b8b98;--line:#1f1f27;--a:#a785ff;--b:#3dd6e6;--pos:#3ecf74;--neg:#ff6b6b;
--live:#3ecf74;--livebg:rgba(62,207,116,.10);--up:#f0a323;--upbg:rgba(240,163,35,.09);--fin:#6b6b78;--finbg:rgba(255,255,255,.035);--over:#3ecf74;--under:#ff6b6b;--gold:#f5c542}
*{box-sizing:border-box}
html{scrollbar-gutter:stable}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.3 Inter,"SF Pro Display",-apple-system,"Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:7px 16px;background:rgba(0,0,0,.82);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:14px;margin-right:auto;flex-wrap:wrap}.brand b{font-size:15px;letter-spacing:-.01em}
.key{display:none;gap:12px;color:#c9c9d4;font-size:11px;align-items:center}.key i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.upd{display:inline-flex;gap:6px;align-items:center;color:#c9c9d4;font-size:11px}.warn{color:var(--up)}
.ctl{display:flex;align-items:center;gap:6px}
.ctl select,.ctl button{font:inherit;color:var(--ink);background:var(--s2);border:1px solid var(--line);border-radius:8px;padding:5px 9px;cursor:pointer}
.ctl button:hover{border-color:var(--a)}.ctl button.lock{border-color:var(--gold);animation:p 1.4s infinite}.ctl button#who{max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ic{opacity:.7;margin-left:4px}
.lgs{display:flex;gap:4px}.lgt{max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:.45}.lgt i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--mute);margin-right:6px}
.lgt.on{opacity:1;border-color:#3a3a46}.lgt.on i{background:var(--a)}
.lgt .sc{margin-left:7px;font-weight:700;font-variant-numeric:tabular-nums;color:#c9c9d4}.lgt.lead .sc{color:var(--pos)}.lgt.trail .sc{color:var(--neg)}
:focus-visible{outline:2px solid var(--a);outline-offset:2px}
main{padding:8px 14px 24px}
#status{color:var(--mute);font-size:12px;margin-bottom:8px}#status.err{color:var(--neg);font-size:14px}
.pulse{width:7px;height:7px;border-radius:50%;background:var(--pos);animation:p 1.6s infinite}
@keyframes p{50%{opacity:.25}}
@keyframes tin{from{transform:translateY(-14px);opacity:0}}
@media(prefers-reduced-motion:reduce){.pulse,.ld,.rz,.toast,td.g-rz{animation:none!important}td.g-rz{background:rgba(255,107,107,.14)}}
/* layout by number of leagues */
.split{display:grid;gap:14px;align-items:start}
.split.n1{grid-template-columns:minmax(0,1fr);max-width:none;margin:0}
.split.n2{grid-template-columns:repeat(2,minmax(0,1fr))}
.split.n3{grid-template-columns:repeat(3,minmax(0,1fr))}
.split.n4{grid-template-columns:repeat(auto-fit,minmax(480px,1fr))}
@media(max-width:1500px){.split.n3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:1000px){.split.n2,.split.n3{grid-template-columns:minmax(0,1fr)}}
.lg{display:flex;flex-direction:column;gap:8px;min-width:0}
.card{background:var(--s1);border:1px solid var(--line);border-radius:12px;overflow:hidden}
/* hero: fixed grid so nothing shifts */
.hero{padding:10px 14px 12px;overflow:visible;background:radial-gradient(120% 150% at 0% 0%,rgba(167,133,255,.15),transparent 55%),radial-gradient(120% 150% at 100% 0%,rgba(61,214,230,.12),transparent 55%),var(--s1)}
.hg{display:grid;grid-template-columns:minmax(0,1fr) 280px minmax(0,1fr);grid-template-rows:36px 46px 28px;column-gap:14px;align-items:center}
.lg.compact .hg{grid-template-columns:minmax(0,1fr) 150px minmax(0,1fr)}
.hnA{grid-area:1/1}.lgn{grid-area:1/2}.hnB{grid-area:1/3}.pt.a{grid-area:2/1}.pt.b{grid-area:2/3}.pjA{grid-area:3/1}.pjB{grid-area:3/3}
.wk{grid-area:2/2/4/3;position:relative;height:78px;align-self:stretch;margin:2px 0 -6px}
.wk svg{display:block;width:100%;height:76px;overflow:visible}
.skl{position:absolute;left:2px;top:-2px;font-size:10px;color:var(--mute)}.skv{position:absolute;right:2px;top:-2px;font-size:11px;font-weight:800;color:var(--mute)}
.fmt{flex:none;font-size:10px;font-weight:700;color:var(--b);border:1px solid rgba(61,214,230,.35);border-radius:4px;padding:0 4px}
.hn{display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-width:0;white-space:nowrap}.hn.r{align-items:flex-end}
.hn b{max-width:100%;overflow:hidden;text-overflow:ellipsis;font-size:15px;line-height:18px}.hu{display:flex;align-items:center;gap:5px;max-width:100%;overflow:hidden;color:var(--mute);font-size:11px;line-height:15px}.hn.r .hu{flex-direction:row-reverse}.hu .mt{margin-left:0}
.lgn{display:flex;justify-content:center;align-items:center;gap:6px;min-width:0;font-size:12px;font-weight:600;color:#c9c9d4;white-space:nowrap}.lgt2{min-width:0;overflow:hidden;text-overflow:ellipsis}
.pt{font-size:34px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:44px;white-space:nowrap}
.pt.a{color:var(--a)}.pt.b{color:var(--b);text-align:right}
.hp{display:flex;gap:10px;align-items:center;white-space:nowrap;overflow:hidden;font-size:12px;color:var(--mute)}.hp.r{flex-direction:row-reverse}
.pjh{font-weight:800;font-size:14px;color:var(--ink)}.pjh.o{color:var(--over)}.pjh.u{color:var(--under)}
.hl{font-size:13px}
.dots{display:inline-flex;gap:3px;align-items:center}.dots i{width:8px;height:8px;border-radius:50%;background:var(--fin)}.dots i.l{background:var(--live);box-shadow:0 0 6px var(--live)}.dots i.u{background:var(--up)}
.bar{position:relative;display:flex;height:22px;margin-top:8px;background:var(--line);border-radius:11px}
.seg{display:flex;align-items:center;font-size:11px;font-weight:800;padding:0 11px;transition:width .6s;white-space:nowrap;overflow:hidden}
.seg.fa{border-radius:11px 0 0 11px;background:linear-gradient(90deg,#7c4dff,#a785ff);color:#fff}
.seg.fb{border-radius:0 11px 11px 0;background:linear-gradient(90deg,#3dd6e6,#22a9bb);color:#03242b;justify-content:flex-end}
.wpl{position:absolute;left:50%;top:0;height:100%;transform:translateX(-50%);display:flex;align-items:center;padding:0 10px;font-size:11px;font-weight:700;color:#fff;text-shadow:0 1px 3px #000,0 0 6px #000;cursor:help;white-space:nowrap}
.tip{display:none;position:absolute;left:50%;transform:translateX(-50%);top:100%;margin-top:8px;width:max-content;max-width:92vw;white-space:nowrap;background:#1a1a22;border:1px solid var(--a);border-radius:10px;padding:8px 12px;font-size:12px;font-weight:400;color:var(--ink);text-shadow:none;z-index:40;box-shadow:0 10px 30px #000}
.wpl:hover .tip,.wpl:focus .tip{display:block}
/* tables: every row has a fixed height */
.tw{overflow:hidden}
table{width:100%;border-collapse:collapse;table-layout:fixed}
tr{height:36px}
td{padding:0 8px;height:36px;border-bottom:1px solid var(--line);vertical-align:middle;overflow:hidden}
tr:last-child td{border-bottom:0}
.cn{width:84px}.cp{width:46px}
.lg.compact .cn{width:66px}.lg.compact .cp{width:34px}
td.pos{text-align:center;color:var(--mute);font-size:11px;font-weight:700;background:rgba(255,255,255,.02)}
td.n{position:relative;text-align:right;font-variant-numeric:tabular-nums}td.n.nl{text-align:left}
td.n b{display:block;height:18px;line-height:18px;font-size:16px;font-weight:800;letter-spacing:-.01em}
.pjc{display:block;height:12px;line-height:12px;font-size:10.5px;font-weight:600;white-space:nowrap;opacity:.8}
.pjc::before{content:"proj ";opacity:.6;font-size:9px;font-weight:500}
.pjc.o{color:#78b892}.pjc.u{color:#c98a8a}.pjc.e{color:var(--mute)}.pjc.f{color:#55555f;opacity:1}
.dl{position:absolute;left:6px;top:2px;font-size:11px;font-weight:800}.nl .dl{left:auto;right:6px}.dl.p{color:var(--pos)}.dl.m{color:var(--neg)}
td.r{text-align:right}
td.g-live{background:var(--livebg);box-shadow:inset 3px 0 0 var(--live)}
td.g-up{background:var(--upbg);box-shadow:inset 3px 0 0 var(--up)}
td.g-final,td.g-bye{background:var(--finbg);box-shadow:inset 3px 0 0 var(--fin)}
td.r.g-live{box-shadow:inset -3px 0 0 var(--live)}td.r.g-up{box-shadow:inset -3px 0 0 var(--up)}td.r.g-final,td.r.g-bye{box-shadow:inset -3px 0 0 var(--fin)}
td.n.g-live,td.n.g-up,td.n.g-final,td.n.g-bye{box-shadow:none}
.g-final .nm,.g-bye .nm{color:var(--mute)}td.g-final b,td.g-bye b{color:#d6d6de}
td.g-rz{animation:rzp 1.4s ease-in-out infinite;box-shadow:inset 3px 0 0 var(--neg)}td.r.g-rz{box-shadow:inset -3px 0 0 var(--neg)}td.n.g-rz{box-shadow:none}
@keyframes rzp{50%{background-color:rgba(255,107,107,.2)}}
td.g-warn{background:rgba(255,107,107,.09);box-shadow:inset 3px 0 0 var(--neg)}td.r.g-warn{box-shadow:inset -3px 0 0 var(--neg)}
.iss{flex:none;background:var(--neg);color:#fff;font-size:10px;font-weight:800;border-radius:8px;padding:1px 6px;cursor:help}
.pjc.nop::before{content:none}
.bar.fin{overflow:hidden}.bar.fin .seg{border-radius:0}.bar.fin .wpl{cursor:default}
.mini.done{opacity:.8}.mini.done .ml{color:var(--ink)}
.pc{display:flex;align-items:center;gap:8px;min-width:0;height:33px}.pc.rv{flex-direction:row-reverse}
.av{width:28px;height:28px;border-radius:50%;object-fit:cover;object-position:top;background:var(--s2);flex:none}.av.d{object-fit:contain;padding:3px}
.px{min-width:0;flex:1}
.pn{display:flex;align-items:center;min-width:0;height:18px;line-height:18px;font-weight:600}.pc.rv .pn{justify-content:flex-end}
.nm{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st{flex:1 1 0;min-width:0;display:flex;flex-wrap:wrap;align-content:flex-start;height:18px;overflow:hidden;font-weight:500;font-size:11px;color:var(--mute)}.si{white-space:nowrap}.si+.si::before{content:", "}.ssep{flex:none;opacity:.35;margin:0 8px;font-size:11px;color:var(--mute)}.snm{display:none}

.pc.rv .st{justify-content:flex-end}
.tag{flex:none;display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box;min-width:16px;height:16px;padding:0 4px;border-radius:8px;font-size:9px;font-weight:800;line-height:1;letter-spacing:0;text-align:center;margin-left:6px}
.tag.one{width:16px;min-width:16px;padding:0}
.wn{background:var(--neg);color:#fff}.rg{background:rgba(240,163,35,.16);color:var(--up);border:1px solid rgba(240,163,35,.5)}
.pc.rv .tag{margin-left:0;margin-right:6px}
.inj{color:#000;background:var(--up)}.inj.o{background:var(--neg)}.inj.d{background:#ff9142}
.rk{color:var(--b);border:1px solid var(--b);background:transparent}
.pm{display:flex;align-items:center;gap:6px;height:14px;line-height:14px;font-size:11px;color:var(--mute);white-space:nowrap;overflow:hidden}.pc.rv .pm{flex-direction:row-reverse}
.pos.QB,.pos.RB,.pos.WR,.pos.TE,.pos.K,.pos.DEF{flex:none;font-size:9px;font-weight:800;color:#000;border-radius:4px;padding:1px 5px;background:#8d99ae}
.pos.QB{background:#ef5b7b}.pos.RB{background:#35c98b}.pos.WR{background:#4aa3ff}.pos.TE{background:#f0a323}.pos.K{background:#b48cff}
.gi{font-weight:700;color:var(--ink)}.g-live .gi{color:var(--ink)}
.ld{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--live);margin-right:4px;animation:p 1.2s infinite}
.rz{background:var(--neg);color:#000;font-weight:800;font-size:9px;border-radius:4px;padding:1px 5px;animation:p 1s infinite}
tr.sep,tr.sep td{height:26px;font-size:12px;color:var(--mute);background:rgba(255,255,255,.02)}
/* plays */
.lh{display:flex;justify-content:space-between;align-items:center;height:26px;padding:0 10px;border-bottom:1px solid var(--line);font-weight:700;font-size:12px}
.lb{height:78px;overflow-y:auto;scrollbar-gutter:stable}
.lr{display:grid;grid-template-columns:62px 66px 50px minmax(0,1.1fr) minmax(0,1.5fr);gap:8px;height:26px;padding:0 10px;border-bottom:1px solid var(--line);align-items:center;white-space:nowrap;overflow:hidden}
.lr.me{box-shadow:inset 3px 0 0 var(--a)}
.lr .t{color:var(--mute);font-size:11px}.lr .d{font-weight:800;font-variant-numeric:tabular-nums}.lr .d.p{color:var(--pos)}.lr .d.m{color:var(--neg)}
.pl2{display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden}.pl2 b{overflow:hidden;text-overflow:ellipsis}.pl2 small{color:var(--mute);flex:none}
.pt2{color:var(--mute);font-size:11px;overflow:hidden;text-overflow:ellipsis}
.k{font-size:10px;font-weight:800;border-radius:6px;padding:2px 6px;text-align:center;overflow:hidden;color:var(--mute);background:rgba(255,255,255,.06)}
.k.PASS{color:#4aa3ff;background:rgba(74,163,255,.14)}.k.RUN{color:#35c98b;background:rgba(53,201,139,.14)}.k.SACK,.k.INT,.k.FUM{color:var(--neg);background:rgba(255,107,107,.14)}
.k.FG,.k.XP{color:#b48cff;background:rgba(180,140,255,.14)}.k.ADJ{color:var(--mute)}.k.TD{color:#000;background:var(--gold)}.k.DEF{color:#8d99ae;background:rgba(141,153,174,.14)}
.td{flex:none;background:var(--gold);color:#000;font-size:9px;font-weight:800;border-radius:4px;padding:1px 5px}
.none{padding:8px 10px;color:var(--mute)}
.np{color:#5d5d6a;font-weight:600}
.boost{cursor:help;color:var(--gold)}
.ctl select{padding-right:6px}
.mt{font-size:10px;font-weight:600;color:#9a9aa8;border:1px solid #2c2c36;border-radius:6px;padding:0 4px;margin-left:6px;cursor:help}
.trk{font-size:10px;color:#6f6f80;margin-right:5px;font-variant-numeric:tabular-nums}
.hook{display:flex;justify-content:space-between;align-items:center;gap:14px;height:40px;padding:0 12px;font-size:12px;white-space:nowrap;cursor:help}
.hk{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}.hk.r{justify-content:flex-end}.hk small{color:var(--mute);margin:0 4px}
.hl2{font-size:11px;color:#c9c9d4}.hn2{font-size:10px;font-weight:700;color:var(--up);border:1px solid rgba(240,163,35,.4);border-radius:6px;padding:0 5px}
.hkc{flex:1.2;min-width:0;display:flex;flex-direction:column;align-items:stretch;gap:3px}.hcn{display:flex;justify-content:space-between;font-size:10px;color:var(--mute);gap:8px;white-space:nowrap;overflow:hidden}.htr{position:relative;display:block;width:100%;height:12px}.htr b{position:absolute;left:2%;right:2%;top:5px;height:2px;border-radius:1px;background:#2a2a33}
.hd{position:absolute;top:2px;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:#5d5d6a;cursor:help}.hd.lo{background:#ff6b6b;width:10px;height:10px;top:1px;margin-left:-5px}.hd.hi{background:#f5c542;width:10px;height:10px;top:1px;margin-left:-5px}.hd.me{background:#a785ff;width:10px;height:10px;top:1px;margin-left:-5px}
.ptag{font-size:9px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:#9a9aa8;border:1px solid #33333f;border-radius:5px;padding:0 4px}.hm{font-size:11px;font-weight:800;font-variant-numeric:tabular-nums}.hm.dn{color:var(--neg)}.hm.up{color:var(--pos)}.hk.r{text-align:right}.hk b{font-weight:700}.hk small{color:var(--mute);margin:0 6px}
.rec{font-size:10px;font-weight:800;color:#000;background:var(--gold);border-radius:6px;padding:1px 5px}.rec.lo{background:var(--neg);color:#fff}
.toast small{font-weight:600;opacity:.8}
.dd{color:var(--ink);font-weight:600}
tr.bhead{cursor:pointer}tr.bhead:hover td{color:var(--ink)}tr.bhead small{margin-left:8px;opacity:.7}.chev{display:inline-block;width:14px}
.rep{align-self:flex-start;font:inherit;font-size:12px;font-weight:600;color:var(--ink);background:var(--s2);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
.rep:hover{border-color:var(--a)}
.rep.cp{flex:none;align-self:center;padding:1px 7px;font-size:13px;line-height:20px;margin-left:2px}
.lh.ph{cursor:pointer}.lh.ph:hover{color:var(--ink)}.lh small{color:var(--mute);font-weight:500}
.pjc.hurt s{opacity:.8;text-decoration-thickness:1px}.rep:disabled{opacity:.6;cursor:wait}
.lg.compact .lr{grid-template-columns:58px 62px 48px minmax(0,1fr)}.lg.compact .pt2{display:none}
/* matchup tiles: fixed height, one row */
.oth{display:grid;gap:8px}
.lg.compact .oth{grid-template-columns:repeat(3,minmax(0,1fr))!important}
.mini{height:auto;overflow:hidden;background:var(--s1);border:1px solid var(--line);border-radius:10px;padding:7px 10px;cursor:pointer;text-align:left;font:inherit;color:var(--mute);min-width:0;transition:border-color .2s}
.mini:hover{border-color:#3a3a46}.mini.on{border-color:var(--a)}

.mr.ld2{color:var(--ink)}.mr.me{color:var(--a)}
.sb{height:3px;border-radius:2px;background:var(--b);margin:5px 0 4px;overflow:hidden}.sb i{display:block;height:100%;background:var(--a)}

/* welcome */

  let f=0;(function step(){ctx.clearRect(0,0,cv.width,cv.height);
    ps.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore()});

  if(quiet()&&!(o&&o.force))return;
  const box=$("toasts");let raw=String(html),icon="";const m=raw.match(/^\s*((?:\p{Extended_Pictographic}|\p{Emoji_Presentation})(?:\uFE0F|\u200D\p{Extended_Pictographic})*)\s*/u);if(m){icon=m[1];raw=raw.slice(m[0].length)}

async function getPlayers(){

    (j.events||[]).forEach(ev=>{const c=ev.competitions[0],st=ev.status,cs=c.competitors,sit=c.situation||{};
      const sig=[(sit.lastPlay&&sit.lastPlay.id)||"",cs.map(x=>x.score).join("-"),st.period,sit.downDistanceText||"",sit.possession||""].join("|");
      cs.forEach(x=>{const o=cs.find(y=>y!==x),has=sit.possession!=null&&String(sit.possession)===String(x.team.id);
        const pt=cs.find(y=>sit.possession!=null&&String(y.team.id)===String(sit.possession));
        g[NT(x.team.abbreviation)]={spot0:sit.possessionText||"",possT:pt?NT(pt.team.abbreviation):"",eid:ev.id,sig,dd:has?(sit.shortDownDistanceText||sit.downDistanceText||""):"",spot:has?(sit.possessionText||""):"",poss:has,rz:has&&!!sit.isRedZone,state:st.type.state,detail:st.type.shortDetail,period:st.period,clock:st.clock,me:+x.score||0,opp:+o.score||0,oppT:NT(o.team.abbreviation),home:x.homeAway==="home",date:ev.date}})});
    const gs=JSON.stringify(Object.keys(g).map(k=>[k,g[k].sig,g[k].state,g[k].clock,g[k].detail]));if(gs!==S.gsig){S.gsig=gs;S.dirty=true}
    const prevG=S.games,now0=Date.now(),flip=[];if(prevG&&Object.keys(prevG).length)for(const t in g){const o=prevG[t];if(!o)continue;if(o.state==="pre"&&g[t].state==="in")flip.push([t,"live"]);else if(!o.rz&&g[t].rz)flip.push([t,"rz"])}

    if(flip.length&&!quiet()){const mine=new Set();vis().forEach(lg=>(lg.matchups||[]).filter(m=>m.roster_id===lg.mineRid).forEach(m=>(m.starters||[]).forEach(id=>{if(flip.some(f=>f[1]==="live"&&f[0]===pinfo(id).team))mine.add(id)})));if(mine.size)toast("info",`🟢 Kickoff · ${mine.size} of your starter${mine.size>1?"s":""} live`,4000)}
    if(flip.length&&!quiet())vis().forEach(lg=>(lg.matchups||[]).forEach(m=>(m.starters||[]).forEach(id=>{const f=flip.find(x=>x[0]===pinfo(id).team);if(f&&!(S.fx[id]&&now0-S.fx[id].t<3000)){S.fx[id]={k:f[1],t:now0};S.dirty=true}})));

  for(const k in sc){let x;if((x=k.match(/^(fgm|fgmiss)_(\d+)_(\d+)$/)))m.derived.push([k,"b",x[1],+x[2],+x[3]]);else if((x=k.match(/^(fgm|fgmiss)_(\d+)p$/)))m.derived.push([k,"b",x[1],+x[2],999]);

/* season simulation: each member's weekly score ~ their hit rate, heavily shrunk toward 50% (ATS skill is mostly noise), over the remaining weeks */
function pkOdds(){
  const C=PK.cfg||POOLDEF.pickem,d={me:C.me,pay:{first:+C.first||0,second:+C.second||0,weekly:+C.weekly||0,weeks:18}},W=PK.weeks,key=W+"|"+PK.rows.map(r=>r.w.join(".")).join(";");if(PK.oddsKey===key)return PK.odds;
  const G=Math.max(1,PK.games.filter(g=>g.w<=W&&(g.ats||g.su)).length),R=Math.max(0,18-W),wk=Math.max(0,d.pay.weeks-W),gpw=16;
  const base=PK.rows.map(r=>{const t=r.w.reduce((a,b)=>a+(+b||0),0);return{u:r.u,t,p:(t+150)/(G+300)}}),meI=base.findIndex(x=>x.u===C.me);if(meI<0)return null;
  const N=3000;let c1=0,c2=0,ws=0;RND=rng32(hash32("pk|"+W));
  for(let n=0;n<N;n++){const tot=base.map(x=>x.t+RND()*1e-3);
    for(let w=0;w<R;w++){const sc=base.map((x,i)=>{const v=Math.max(0,Math.min(gpw,Math.round(gpw*x.p+Math.sqrt(gpw*x.p*(1-x.p))*gauss())));tot[i]+=v;return v});
      if(w<wk){const m=Math.max(...sc),win=sc.reduce((a,v,i)=>v===m?a.concat(i):a,[]);if(win.includes(meI))ws+=d.pay.weekly/win.length}}
    const o=tot.map((v,i)=>[v,i]).sort((x,y)=>y[0]-x[0]);if(o[0][1]===meI)c1++;else if(o[1][1]===meI)c2++}
  RND=Math.random;PK.odds={first:c1/N,second:c2/N,weekly:ws/N,R};PK.oddsKey=key;return PK.odds;
}

  const html=head+`<div class="svgrid rpgrid"><!--M:reel-->${reel}<!--M:stage-->${parts.stage}<!--M:timeline-->${timeline}<!--M:film-->${film}<!--M:/--></div>`;
  /* patch only what changed (keeps the stage animation, scroll position and the selected play during live refreshes) */
  if(RP.sig===sig&&el.querySelector("[data-rp]")){let any=false;[["head",head],["reel",reel],["stage",stage],["impact",impact],["timeline",timeline],["film",film]].forEach(([k,v])=>{if(RP.parts[k]===v)return;const n=el.querySelector(`[data-rp="${k}"]`);
      if(n&&v){const t=document.createElement("div");t.innerHTML=v;n.replaceWith(t.firstElementChild);any=true}else if(!n&&v||n&&!v){any="full"}RP.parts[k]=v});
    if(any==="full"){RP.sig=null;return rpRender()}if(any)rpBind(el);return}
  RP.sig=sig;RP.parts={head,reel,stage,impact,timeline,film};el.innerHTML=modWrap(html,"f");rpBind(el)}
function rpBind(el){bindMods(el);
  const rr=()=>rpRender();
  el.querySelectorAll("[data-ev]").forEach(b=>b.onclick=()=>{RP.sel=b.dataset.ev;RP.nonce++;rr()});
  el.querySelectorAll("[data-rpm]").forEach(b=>b.onclick=()=>{RP.mode=b.dataset.rpm;RP.sel=null;rr()});
  el.querySelectorAll("[data-fp]").forEach(b=>b.onclick=()=>{RP.fp=RP.fp===b.dataset.fp?null:b.dataset.fp;RP.sel=null;rr()});
  const q=(id,f)=>{const x=el.querySelector("#"+id);if(x)f(x)};
  q("rplg",x=>x.onchange=()=>{RP.lg=x.value;RP.sel=null;rr()});q("rpsd",x=>x.onchange=()=>{RP.side=x.value;RP.sel=null;rr()});
  q("rpfpx",x=>x.onclick=()=>{RP.fp=null;rr()});q("rpsince",x=>x.onclick=()=>{RP.since=!RP.since;RP.sel=null;rr()});
  q("rpmore",x=>x.onclick=()=>{RP.more=!RP.more;rr()});q("rplist",x=>x.onclick=()=>{RP.list=!RP.list;rr()});
  q("rpreplay",x=>x.onclick=()=>{RP.nonce++;RP.parts.stage="";rr()})}
/* play-by-play for every game with a relevant player (all connected leagues); live games refresh when something happens */
async function rpTick(){
  const ctx=rpCtx();if(!ctx.length){if(S.tab==="f")rpRender();return}
  const eids=new Map();ctx.forEach(c=>[...c.my,...c.op,...c.bench].forEach(id=>{const g=S.games[pinfo(id).team];if(g&&g.eid&&g.state!=="pre")eids.set(g.eid,g)}));
  const now=Date.now(),jobs=[];
  eids.forEach((g,eid)=>{const f=S.fl[eid]||(S.fl[eid]={sig:"",at:0});
    if(!S.drv[eid]||(g.state==="in"&&((f.sig!==g.sig&&now-f.at>2500)||now-f.at>20000))){f.sig=g.sig;f.at=now;jobs.push(fetchBox(eid))}
    jobs.push(rpCore(eid,g.state==="in"))});
  if(jobs.length)await Promise.all(jobs);
  if(S.tab==="f")rpRender()}
/* ---------- tabs ---------- */
S.tab=load("tab")||"m";
/* Edge is unlocked per device. Wingman has no server and no accounts: every recommendation is computed in this browser
   from leagues you connected here, so nothing personal is published with the site. The password keeps Edge out of sight
   on shared screens / for people using Wingman on their own device; it is not server-side security. */
const EDGE_H="a1cb100f57e971cacf269e7c26e4630a25a8e9d4bdd35e32df1a80b66b896254";
async function sha256hex(s){try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){return""}}
const edgeOK=()=>load("edge_ok")===EDGE_TOKEN();
const EDGE_TOKEN=()=>"v1:"+EDGE_H.slice(0,16);
function edgeLock(){try{localStorage.removeItem("lm_edge_ok")}catch(e){}updateNav();if(S.tab==="e")setTab("t")}
function edgePrompt(then){let m=$("edgelock");if(!m){m=document.createElement("div");m.id="edgelock";m.className="edgelock";document.body.appendChild(m)}
  m.innerHTML=`<div class="elk" role="dialog" aria-label="Unlock Edge"><div class="elh">${CHEST_SVG}<b>Edge</b></div><p>Private tools for your leagues. Enter the password to open them on this device.</p>
    <form id="elkf"><input id="elkp" type="password" autocomplete="current-password" placeholder="Password" aria-label="Password"><button class="pcta" type="submit">Unlock</button></form><small id="elke" class="werr"></small><button class="elx" type="button" aria-label="Close">✕</button></div>`;
  m.classList.add("open");const inp=m.querySelector("#elkp");setTimeout(()=>{try{inp.focus()}catch(e){}},50);
  const close=()=>m.classList.remove("open");m.querySelector(".elx").onclick=close;m.onclick=e=>{if(e.target===m)close()};
  m.querySelector("#elkf").onsubmit=async e=>{e.preventDefault();const ok=(await sha256hex(inp.value.trim().toLowerCase()))===EDGE_H;
    if(ok){save("edge_ok",EDGE_TOKEN());close();updateNav();then&&then()}else{m.querySelector("#elke").textContent="That's not it.";inp.select()}}}
function setTab(t){
  if(t==="e"&&!edgeOK()){edgePrompt(()=>setTab("e"));return}
  if(S.tab==="f"&&t!=="f"){RP.lastSeen=Date.now();save("rp_seen",String(RP.lastSeen));RP.since=false}
  S.tab=t;save("tab",t);document.body.classList.toggle("tab-s",t==="s");document.body.classList.toggle("tab-x",t!=="m");
  document.querySelectorAll("header .tb[data-t]").forEach(b=>b.classList.toggle("on",b.dataset.t===t));

  const loggedIn=S.L.length>0,onWelcome=$("welcome").style.display!=="none";
  $("surv").style.display=t==="s"?"":"none";$("pick").style.display=t==="p"?"":"none";$("moves").style.display=t==="t"||t==="e"?"":"none";$("field").style.display=t==="f"?"":"none";
  if(t!=="m"){$("view").style.display="none";$("welcome").style.display="none";$("status").style.display="none"}
  if(t==="s"){SV.lastHtml="";svRender();svTick()}
  else if(t==="p"){PK.lastHtml="";pkRender();pkTick()}
  else if(t==="t"){MV.view="lab";MV.lastHtml="";mvRender();mvTick()}
  else if(t==="e"){MV.view="edge";MV.lastHtml="";mvRender();mvTick();edgeLeagues().forEach(l=>idealBuild(l))}
  else if(t==="f"){RP.sig=null;rpRender();rpTick()}
  else{if(loggedIn){$("view").style.display="";$("welcome").style.display="none";applyVis()}else{$("welcome").style.display=""}}
}
document.querySelectorAll("header .tb[data-t]").forEach(b=>b.onclick=()=>setTab(b.dataset.t));

SV.lastTick=0;setInterval(async()=>{if(document.hidden)return;const n=Date.now(),every=(+$("every").value||3)*1000;if(n-SV.lastTick>=(S.tab==="s"||S.tab==="p"?every:60000)){SV.lastTick=n;if(hasMode("survivor"))await svTick();if(hasMode("pickem")){if(S.tab==="p")await pkTick();else if(PK.weeks){await pkLoadNext(PK.wSheet||PK.weeks,15000);await pkLoadNext((PK.wSheet||PK.weeks)+1,30000)}}try{renderSweat()}catch(e){}}},1000);
setInterval(()=>{if((S.tab==="t"||S.tab==="e")&&!document.hidden)mvTick()},30000);
pkLoad();applySheetModes(false);updateNav();
if(hasMode("survivor"))svInit().then(()=>{if(S.tab!=="m")setTab(S.tab)});else if(S.tab!=="m"&&S.tab!=="s"&&S.tab!=="p")setTab(S.tab);
/* only pools linked (no fantasy league yet): open the pool instead of an empty Matchups */
function openApp(){const cs=S.conns||getConns();if(cs.length&&cs.every(c=>SHEETMODES[c.p])){document.body.classList.remove("nolg");updateNav();setTab(SHEETMODES[cs[0].p].tab);return}connectAll()}
$("go").onclick=openApp;
if(S.nickToast)setTimeout(()=>{try{toast("good",`✓ ${S.nickToast} nicknames saved on this device`,3000)}catch(e){}},2500);
$("wshare").onclick=async()=>{const ok=await copyText(setupLink());const b=$("wshare");b.textContent=ok?"✓ Link copied":"Couldn't copy";setTimeout(()=>{b.textContent="⧉ Copy setup link"},2200)};

$("week").onchange=()=>{S.L.forEach(l=>{l.rf={}});S.raw=null;S.baseWeek=0;S.stats={};S.statsHave=false;S.statsVol=0;S.desc={};S.stxt="";S.eff={};S.box={};S.fl={};S.fltxt={};S.reg={};S.effPrimed=false;S.okFast=false;S.dirty=true;S.L.forEach(l=>Object.assign(l,{mu:null,prev:{},delta:{},acc:{},off:{},offi:{},cmp:{},log:[],hist:{},focus:null,leadSign:0,lastHtml:"",primed:false}));refresh()};
$("every").onchange=schedule;
document.addEventListener("visibilitychange",()=>{if(!document.hidden)refresh()});
addEventListener("online",()=>refresh());addEventListener("offline",()=>document.body.classList.add("offline"));
if(window.matchMedia)matchMedia("(max-width:760px)").addEventListener("change",()=>{if(S.L.length)applyVis()});
setInterval(tickStatus,1000);
$("who").onclick=()=>{showWelcome();$("werr").textContent=""};
$("wback").onclick=()=>{$("welcome").style.display="none";$("view").style.display=""};
let urlUser="";try{urlUser=new URLSearchParams(location.search).get("user")||""}catch(e){}
if(urlUser&&!getConns().some(c=>c.p==="sleeper"&&c.username.toLowerCase()===urlUser.toLowerCase())){const c=getConns().concat({key:"sleeper:"+urlUser.toLowerCase(),p:"sleeper",username:urlUser});save("conns",JSON.stringify(c))}
if(getConns().length){$("welcome").style.display="none";connectAll()}else{showWelcome()}
